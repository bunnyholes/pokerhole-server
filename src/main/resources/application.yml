spring:
  application:
    name: pokerhole

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema, Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

pokerhole:
  game:
    initial-chips: 10000
    minimum-bet: 100
    blind-amount: 50
    max-players: 10
    min-players: 2
    round-timeout-seconds: 60
    turn-timeout-seconds: 30

  matching:
    auto-matching-enabled: true
    wait-timeout-seconds: 5
    queue-process-interval-ms: 5000
    players-per-game: 4
    ai-player-enabled: true
    code-matching-enabled: true
    code-expiration-minutes: 30

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
